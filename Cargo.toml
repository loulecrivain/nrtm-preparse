[package]
name = "nrtm-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
pest = "2.9.0"
pest_derive = "2.9.0"
tokio = { version = "1.53.1", optional = true }
tokio-util = { version = "0.7.19", optional = true, features = ["codec"] }
tokio-stream = "0.1.19"


[features]
default = [ ]
async-streaming = [ "dep:tokio-util", "dep:tokio" ]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["fs", "macros", "rt" ] }
tokio-test = "0.4.5"
